name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'   # nightly: live conformance (when secrets are configured)

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: platform_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust   # CI-only throwaway database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform_owner" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://platform_owner@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint (incl. secret scan, module READMEs, generated registries)
        run: npm run lint
      - name: Dependency boundaries (M1–M10, layers, vendor SDKs, model ids)
        run: npm run boundaries
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (unit, integration, isolation, removal matrix, adapter conformance - recorded)
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  live-conformance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_OPENAI_KEY: ${{ secrets.CONFORMANCE_OPENAI_KEY }}
      CONFORMANCE_OPENAI_MODEL: ${{ vars.CONFORMANCE_OPENAI_MODEL }}
      CONFORMANCE_ANTHROPIC_KEY: ${{ secrets.CONFORMANCE_ANTHROPIC_KEY }}
      CONFORMANCE_ANTHROPIC_MODEL: ${{ vars.CONFORMANCE_ANTHROPIC_MODEL }}
      CONFORMANCE_GEMINI_KEY: ${{ secrets.CONFORMANCE_GEMINI_KEY }}
      CONFORMANCE_GEMINI_MODEL: ${{ vars.CONFORMANCE_GEMINI_MODEL }}
      CONFORMANCE_GROQ_KEY: ${{ secrets.CONFORMANCE_GROQ_KEY }}
      CONFORMANCE_GROQ_MODEL: ${{ vars.CONFORMANCE_GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run conformance:live
